[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-rover-ground-station"
version = "2.0.0"
description = "Real-rover mission, perception, navigation, and safety supervision dashboard"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "MARS Rover Team"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
